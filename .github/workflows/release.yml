name: Build GmsProtect APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        clean: true

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Auto-generate Gradle Wrapper if missing
      run: |
        if [ ! -f "gradlew" ]; then
          echo "Gradle wrapper missing, generating on the fly..."
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          export PATH=$PWD/gradle-8.5/bin:$PATH
          gradle wrapper --gradle-version 8.5
        fi
        chmod +x gradlew

    - name: Set up Dynamic Version
      run: |
        RUN_NUM=${{ github.run_number }}
        PATCH_VERSION=$(printf "%02d" $RUN_NUM)
        VERSION_CODE=$RUN_NUM
        VERSION_NAME="2.0.$PATCH_VERSION"
        
        echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
        echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

    - name: Clean build files
      run: ./gradlew clean

    - name: Decode Keystore
      env:
        SIGNING_KEY_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        # Giải mã Keystore và đặt đúng vào thư mục app/ TRƯỚC KHI build
        echo "$SIGNING_KEY_BASE64" | base64 --decode > app/keystore.jks

    - name: Build and Sign Release APK via Gradle
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew assembleRelease -PAPK_VERSION_CODE=${{ env.VERSION_CODE }} -PAPK_VERSION_NAME=${{ env.VERSION_NAME }}

    - name: Rename Signed APK
      run: |
        # Đổi tên file APK (đã được Gradle ký sẵn) thành tên phiên bản
        mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/GmsProtect-v${{ env.VERSION_NAME }}.apk
        
        # Xóa file keystore nhạy cảm sau khi build xong
        rm app/keystore.jks

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: app/build/outputs/apk/release/GmsProtect-v*.apk

    - name: Publish Unique Release to GitHub
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        TAG_NAME="v${{ env.VERSION_NAME }}"
        
        git tag "$TAG_NAME"
        git push origin "$TAG_NAME"
        
        gh release create "$TAG_NAME" app/build/outputs/apk/release/GmsProtect-v${{ env.VERSION_NAME }}.apk \
          --title "GmsProtect v${{ env.VERSION_NAME }} (Build #${{ env.VERSION_CODE }})" \
          --notes "Bản phát hành tự động v${{ env.VERSION_NAME }} đã được biên dịch và ký số tự động."
