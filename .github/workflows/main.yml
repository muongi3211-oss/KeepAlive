name: Build GmsProtect APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Cấp quyền để GitHub Actions tạo và cập nhật Release

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Lấy toàn bộ lịch sử và tag

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Generate Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.5
        chmod +x gradlew

    - name: Check version mode (v1.0 or v2.0)
      run: |
        git fetch --tags
        
        # Nếu chưa có tag v1.0 thì lần chạy này sẽ là v1.0 và giữ lại vĩnh viễn
        if ! git rev-parse v1.0 >/dev/null 2>&1; then
          echo "MODE=v1" >> $GITHUB_ENV
          VERSION_NAME="1.0.${{ github.run_number }}"
          echo "Creating v1.0 permanent release..."
        else
          echo "MODE=v2" >> $GITHUB_ENV
          VERSION_NAME="2.0.${{ github.run_number }}"
          echo "v1.0 already exists. Operating in v2.0 overwrite mode..."
        fi
        
        echo "VERSION_CODE=${{ github.run_number }}" >> $GITHUB_ENV
        echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
        echo "Building version: $VERSION_NAME"

    - name: Build Release APK
      run: ./gradlew assembleRelease -PAPK_VERSION_CODE=${{ env.VERSION_CODE }} -PAPK_VERSION_NAME=${{ env.VERSION_NAME }}

    - name: Sign APK with apksigner
      env:
        SIGNING_KEY_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        # Giải mã keystore từ Base64
        echo "$SIGNING_KEY_BASE64" | base64 --decode > keystore.jks
        
        # Tìm đường dẫn apksigner trong Android SDK
        BUILD_TOOLS_DIR=$(ls -d $ANDROID_SDK_ROOT/build-tools/* | tail -n 1)
        APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
        
        # Tìm file APK vừa build
        APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" ! -name "*-signed.apk")
        
        # Ký chữ ký số cho APK
        $APKSIGNER sign --ks keystore.jks \
          --ks-key-alias "$KEY_ALIAS" \
          --ks-pass pass:"$KEYSTORE_PASSWORD" \
          --key-pass pass:"$KEY_PASSWORD" \
          "$APK_PATH"
          
        # Đổi tên file sau khi ký xong
        mv "$APK_PATH" app/build/outputs/apk/release/GmsProtect-v${{ env.VERSION_NAME }}.apk
        
        # Dọn dẹp tệp keystore tạm
        rm keystore.jks

    - name: Upload APK artifact (Dự phòng)
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: app/build/outputs/apk/release/*.apk

    - name: Publish to GitHub Releases
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        if [ "${{ env.MODE }}" = "v1" ]; then
          # Xóa sạch tag và release v1.0 cũ nếu có
          gh release delete v1.0 --yes || true
          git tag -d v1.0 2>/dev/null || true
          git push origin --delete v1.0 2>/dev/null || true

          # Tạo và đẩy bản v1.0 cố định
          git tag v1.0
          git push origin v1.0
          
          gh release create v1.0 app/build/outputs/apk/release/GmsProtect-v${{ env.VERSION_NAME }}.apk \
            --title "GmsProtect v1.0 (Bản gốc cố định)" \
            --notes "Bản v1.0 cố định được giữ lại làm mốc ổn định (Build #${{ env.VERSION_CODE }})."
        else
          # Chế độ v2.0: Xóa sạch cả release, local tag và remote tag v2.0 trước khi tạo mới
          gh release delete v2.0 --yes || true
          git tag -d v2.0 2>/dev/null || true
          git push origin --delete v2.0 2>/dev/null || true

          git tag v2.0
          git push origin v2.0
          
          gh release create v2.0 app/build/outputs/apk/release/GmsProtect-v${{ env.VERSION_NAME }}.apk \
            --title "GmsProtect v2.0 (Build #${{ env.VERSION_CODE }})" \
            --notes "Bản cập nhật tự động mới nhất v2.0 (Build #${{ env.VERSION_CODE }}) đã được ký chữ ký số thành công."
        fi
