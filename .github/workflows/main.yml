name: Build and Release FCM Guard

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Cấp quyền ghi để tạo Release tự động

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Cache Android Keystore
      uses: actions/cache@v4
      with:
        path: ~/.android
        key: android-debug-keystore-fixed
        restore-keys: |
          android-debug-keystore-

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build Debug APK with Gradle
      run: gradle assembleDebug

    # Tự động tạo hoặc cập nhật bản Release mang tên "latest" kèm file APK
    - name: Upload to GitHub Releases
      uses: ncipollo/release-action@v1
      with:
        artifacts: "app/build/outputs/apk/debug/app-debug.apk"
        tag: "latest"
        name: "FCM Guard Auto Update"
        allowUpdates: true
        replacesArtifacts: true
        body: "Bản cập nhật tự động mới nhất từ GitHub Actions."
