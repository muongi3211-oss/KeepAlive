name: Build FCM Guard APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Cho phép bấm nút Build thủ công trên GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Tải mã nguồn từ repository về máy chủ ảo của GitHub
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Cài đặt môi trường Java JDK 17 (Tiêu chuẩn bắt buộc cho các phiên bản Gradle mới)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    # 3. Cấp quyền thực thi cho Gradle wrapper (tránh lỗi từ chối quyền trên Linux)
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 4. Thực hiện lệnh biên dịch file APK bản Debug
    - name: Build Debug APK with Gradle
      run: ./gradlew assembleDebug

    # 5. Lưu trữ và đính kèm file APK để bạn tải trực tiếp về điện thoại
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FCM-Guard-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
