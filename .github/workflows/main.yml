name: Build GmsProtect APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Cấp quyền để GitHub Actions tự động tạo và cập nhật Release

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Auto-generate Gradle Wrapper
      run: |
        # Tự động tạo các tệp gradlew và thư mục gradle trực tiếp trên server GitHub
        sudo apt-get update && sudo apt-get install -y gradle
        gradle wrapper --gradle-version 8.5
        chmod +x gradlew

    - name: Set up Dynamic Version
      run: |
        # Dùng số lần chạy GitHub Actions làm versionCode (tăng dần tự động)
        VERSION_CODE=${{ github.run_number }}
        # Tự động tạo versionName dạng 1.0.[Số_lần_chạy]
        VERSION_NAME="1.0.$VERSION_CODE"
        
        echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
        echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
        echo "Building version: $VERSION_NAME (Code: $VERSION_CODE)"

    - name: Build Release APK
      run: ./gradlew assembleRelease -PAPK_VERSION_CODE=${{ env.VERSION_CODE }} -PAPK_VERSION_NAME=${{ env.VERSION_NAME }}

    - name: Upload APK artifact (Dự phòng)
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: app/build/outputs/apk/release/*.apk

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: "GmsProtect v${{ env.VERSION_NAME }}"
        body: "Bản cập nhật tự động mới nhất v${{ env.VERSION_NAME }} (Build #${{ env.VERSION_CODE }}) được build từ GitHub Actions."
        files: |
          app/build/outputs/apk/release/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
