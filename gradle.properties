# ==============================================================================
# JVM & Performance Optimization
# ==============================================================================
# Tăng bộ nhớ RAM cấp cho JVM lên 2GB để biên dịch Kotlin nhanh hơn
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Bật tính năng build song song giữa các module (nếu dự án mở rộng sau này)
org.gradle.parallel=true

# Bật Gradle Build Cache để tái sử dụng các task đã build trước đó
org.gradle.caching=true

# Bật Daemon để giữ tiến trình Gradle chạy ngầm trong môi trường local
org.gradle.daemon=true

# ==============================================================================
# AndroidX & Jetifier
# ==============================================================================
# Sử dụng thư viện AndroidX chuẩn thay cho Support Library cũ
android.useAndroidX=true

# Tự động chuyển đổi các thư viện bên thứ ba cũ sang tương thích với AndroidX
android.enableJetifier=true

# ==============================================================================
# Kotlin Compilation Options
# ==============================================================================
# Bật tính năng biên dịch tăng tiến (Incremental Compilation) cho Kotlin
kotlin.incremental=true

# Bật tính năng gửi báo cáo build Kotlin
