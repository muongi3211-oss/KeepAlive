plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kinh.gmsprotect'
    compileSdk 34

    defaultConfig {
        applicationId "com.kinh.gmsprotect"
        minSdk 24
        targetSdk 34
        
        // Đọc tự động version từ GitHub Actions hoặc dùng giá trị mặc định khi build local
        versionCode project.hasProperty('APK_VERSION_CODE') ? project.property('APK_VERSION_CODE').toInteger() : 445
        versionName project.hasProperty('APK_VERSION_NAME') ? project.property('APK_VERSION_NAME') : "2.0.445"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
