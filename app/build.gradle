plugins {
    id 'com.android.application'
}

android {
    compileSdk 34

    defaultConfig {
        minSdk 24
        targetSdk 34 // Hoặc 22 tùy theo cấu hình của bạn
        // ... các cấu hình khác
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Cấu hình vô hiệu hoá kiểm tra Lint (dành cho Android Gradle Plugin mới)
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
