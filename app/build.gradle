plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android' // <--- THÊM PLUGIN KOTLIN VÀO ĐÂY
}

android {
    namespace 'com.kinh.gmsprotect'
    compileSdk 34

    defaultConfig {
        applicationId "com.kinh.gmsprotect"
        minSdk 22
        targetSdk 34
        
        versionCode project.hasProperty('APK_VERSION_CODE') ? project.property('APK_VERSION_CODE').toInteger() : 445
        versionName project.hasProperty('APK_VERSION_NAME') ? project.property('APK_VERSION_NAME') : "2.0.445"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false // Nếu sau này bạn bật true thì file proguard-rules.pro mới hoạt động
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    
    // <--- THÊM DÒNG NÀY ĐỂ ĐẢM BẢO KOTLIN RUNTIME HOẠT ĐỘNG ỔN ĐỊNH
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.0"
}
